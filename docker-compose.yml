name: student-management-backend

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_HOST_PORT:-8920}:8000"
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "celery_app.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "celery_app.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'celery_app.celery_app beat' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis-data:

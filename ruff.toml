"app/core/security/dependencies.py" = ["B008", "E501"]
"app/core/security/parent_access.py" = ["B008", "E501"]
"app/modules/authentication/router.py" = ["B008"]
"app/modules/authentication/repository.py" = ["E501"]
"app/modules/authentication/service.py" = ["E501"]
"tests/unit/test_authentication_foundation.py" = ["E501"]

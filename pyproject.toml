[project]
name = "student-management-backend"
version = "0.1.0"
description = "FastAPI modular monolith backend for the Student Management System."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "celery>=5.4.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "weasyprint>=63.1"
]

[dependency-groups]
dev = [
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "ruff>=0.9.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


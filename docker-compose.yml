name: student-management-backend

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env.example
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery-worker:
    build: .
    env_file: .env.example
    command: celery -A celery_app.celery_app worker --loglevel=INFO
    depends_on:
      - redis

  celery-beat:
    build: .
    env_file: .env.example
    command: celery -A celery_app.celery_app beat --loglevel=INFO
    depends_on:
      - redis
